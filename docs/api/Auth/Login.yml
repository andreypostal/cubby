info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{server}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "pass"
      }

runtime:
  variables:
    - name: server
      value: http://127.0.0.1:8080/api/v1
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        const token = data.token;

        if (token) {
          bru.setVar("token", token);
          console.log("Token successfully saved to environment to "+token);
        } else {
          console.error("Token not found in response body.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
