docs: |-
  # Reset Workspace

  Clears the active workspace from the current session, without ending it. The
  counterpart of `PATCH /auth/me/workspace`.

  ## How it works

  The active workspace lives on the **session row**, not in the token, so this
  is a write to the session the bearer token points at. The token itself stays
  valid and is not reissued — the very next request simply arrives with no
  workspace attached.

  Use it when the user leaves or deletes the workspace they were working in, so
  the session does not keep pointing at something they can no longer reach.

  ## System impact

  - **Updates one `Session` row**, setting its workspace to `null`.
  - Touches no workspace, and no data inside one.

  Afterwards every workspace-scoped endpoint (`/tasks`, `/shop`, `/recipes`,
  `/routines`) answers `403` until a workspace is selected again. Endpoints
  scoped to the user only — `GET /auth/me`, `GET /auth/workspaces` — keep
  working, which is what lets the client offer a workspace picker.

  ## Errors

  | Status | When |
  |---|---|
  | `401` | No session |
  | `403` | The session could not be updated |

  Responds `204` with no body.
