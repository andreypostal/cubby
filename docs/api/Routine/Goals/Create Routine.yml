info:
  name: Create Routine
  type: http
  seq: 2

http:
  method: POST
  url: "{{server}}/routines"
  body:
    type: json
    data: |-
      {
        "name": "Drink Water",
        "description": "Drink at least 2L of water",
        "pinned": false,
        "on_monday": true,
        "on_tuesday": true,
        "on_wednesday": true,
        "on_thursday": true,
        "on_friday": true,
        "on_saturday": false,
        "on_sunday": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        const id = data.id;

        if (id) {
          bru.setVar("routineID", id);
          console.log("routineID successfully saved to var");
        } else {
          console.error("ID not found in response body.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
