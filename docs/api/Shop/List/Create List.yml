info:
  name: Create List
  type: http
  seq: 3

http:
  method: POST
  url: "{{server}}/shop/lists"
  body:
    type: json
    data: |-
      {
        "name": "Weekly Groceries",
        "icon": "shopping-cart"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        const id = data.id;

        if (id) {
          bru.setVar("listID", id);
          console.log("listID successfully saved to var");
        } else {
          console.error("ID not found in response body.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
