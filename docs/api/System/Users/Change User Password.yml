info:
  name: Change User Password
  type: http
  seq: 4

http:
  method: PUT
  url: "{{server}}/users/{{userID}}/password"
  body:
    type: json
    data: |-
      {
        "password": "a-brand-new-password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Change User Password

  Sets a new password for somebody, which is how a forgotten one is recovered —
  the application has no reset-by-email.

  ## Requires a system admin

  The old password is not asked for: an administrator resetting one usually does
  not have it. Every session that user holds is erased in the same call, since
  the reason for a reset is normally that the old password leaked.

  ## Response

  `204`, with no body.

  ## Errors

  | Status | When |
  |---|---|
  | `400` | The user id is not a number |
  | `401` | No session |
  | `403` | The user is not a system admin |
  | `404` | No such user |
  | `422` | The password is missing or under 8 characters |
