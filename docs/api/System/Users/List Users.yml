info:
  name: List Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{server}}/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List Users

  Everyone who can sign in to this server, ordered by name. The application has
  no sign-up, so this list only ever changes from here or from the
  `server setup` commands.

  ## Requires a system admin

  ## Response

  ```json
  {
    "users": [
      { "id": 1, "name": "Admin", "username": "admin", "is_system_admin": true },
      { "id": 2, "name": "Ada", "username": "ada", "is_system_admin": false }
    ]
  }
  ```

  Password hashes are not part of the payload, and never have been.

  ## Errors

  | Status | When |
  |---|---|
  | `401` | No session |
  | `403` | The user is not a system admin |
