info:
  name: Download Backup
  type: http
  seq: 3

http:
  method: GET
  url: "{{server}}/backups/{{backupName}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Download Backup

  Streams an archive that already exists in the backup folder, byte for byte.
  Use `List Backups` first — it saves the newest name into `{{backupName}}`.

  ## Requires a system admin

  Same scope as the rest of the backup family: a system admin session, since an
  archive contains every workspace in the database.

  ## How it works

  Unlike `POST /backup`, this creates nothing and freezes nothing — it is a
  plain file read, so it can run while the system is serving traffic.

  The response is the zip itself:

  ```
  Content-Type: application/zip
  Content-Disposition: attachment; filename=cubby-backup-20260813-172846.397.zip
  Accept-Ranges: bytes
  ```

  `Accept-Ranges` means a large archive can be resumed rather than restarted.

  ## Name handling

  `:name` is a bare filename, never a path. Anything carrying a separator or
  `..`, or not matching the archive naming pattern, is rejected with `400`
  before the filesystem is touched — the folder cannot be escaped by asking for
  `../../config.yaml`.

  ## Errors

  | Status | When |
  |---|---|
  | `400` | The name is not a valid backup archive name |
  | `401` | No session |
  | `403` | The user is not a system admin |
  | `404` | No archive by that name in the backup folder |

  Responds `200` with the archive as an attachment.
