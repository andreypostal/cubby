<!doctype html>
<html lang="en" class="antialiased font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cubby</title>
    <script>
      // Applies the persisted theme before first paint. next-themes only sets
      // the class on mount, which without a server-rendered document means a
      // flash of the wrong theme. Key and values match next-themes' storage.
      ;(function () {
        try {
          var stored = localStorage.getItem("theme") || "system"
          var resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored
          document.documentElement.classList.add(resolved)
          document.documentElement.style.colorScheme = resolved
        } catch (e) {
          /* localStorage unavailable; next-themes resolves it on mount */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
